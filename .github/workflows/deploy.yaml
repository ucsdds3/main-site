name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Vercel deploy target (production requires GitHub environment approval)
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production

# Serialize `dev` deploys and cancel superseded runs so an older build cannot
# alias `dev.ds3atucsd.com` after a newer one. Other branches keep overlapping
# runs (production approval path unchanged).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name == 'dev' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.target.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Get commit message
        id: commit
        run: |
          msg=$(git log -1 --pretty=%B | tr -d '\n')
          echo "message=$msg" >> "$GITHUB_OUTPUT"

      - name: Resolve deploy target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
          DISPATCH_TARGET: ${{ github.event.inputs.deploy_target }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "mode=$DISPATCH_TARGET" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$REF_NAME" == "dev" ]]; then
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$COMMIT_MESSAGE" == *"#prod"* || "$COMMIT_MESSAGE" == *"hotfix"* ]]; then
            echo "mode=production" >> "$GITHUB_OUTPUT"
          else
            echo "mode=preview" >> "$GITHUB_OUTPUT"
          fi

  deploy-preview:
    needs: resolve
    if: needs.resolve.outputs.mode != 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --token=$VERCEL_TOKEN

      - name: Build (preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          STAGING_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          STAGING_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
          STAGING_TL: ${{ secrets.STAGING_VITE_TALENTLENS_V2_API_URL }}
          PROD_URL: ${{ secrets.VITE_SUPABASE_URL }}
          PROD_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PROD_TL: ${{ secrets.VITE_TALENTLENS_V2_API_URL }}
          VITE_GOOGLE_CALENDAR_ID: ${{ secrets.VITE_GOOGLE_CALENDAR_ID }}
          VITE_GOOGLE_CALENDAR_API_KEY: ${{ secrets.VITE_GOOGLE_CALENDAR_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" == "dev" ]]; then
            if [[ -z "$STAGING_URL" || -z "$STAGING_KEY" ]]; then
              echo "::error::dev deployments require STAGING_VITE_SUPABASE_URL and STAGING_VITE_SUPABASE_ANON_KEY (no production fallback)."
              exit 1
            fi
            export VITE_SUPABASE_URL="$STAGING_URL"
            export VITE_SUPABASE_ANON_KEY="$STAGING_KEY"
            export VITE_TALENTLENS_V2_API_URL="${STAGING_TL:-}"
          else
            export VITE_SUPABASE_URL="$PROD_URL"
            export VITE_SUPABASE_ANON_KEY="$PROD_KEY"
            export VITE_TALENTLENS_V2_API_URL="${PROD_TL:-}"
          fi
          export VITE_GOOGLE_CALENDAR_ID="${VITE_GOOGLE_CALENDAR_ID:-}"
          export VITE_GOOGLE_CALENDAR_API_KEY="${VITE_GOOGLE_CALENDAR_API_KEY:-}"
          bash scripts/write-vite-env-for-ci.sh
          echo "🏗️ Building for Preview (branch: $REF_NAME)"
          vercel build --token="$VERCEL_TOKEN"
          bash scripts/verify-vite-env-in-dist.sh

      - name: Deploy (preview)
        id: deploy_preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "👀 Preview Deploy"
          # stdout is the deployment URL (Vercel CLI contract for non-JSON mode).
          vercel deploy --prebuilt --token="$VERCEL_TOKEN" > deployment-url.txt
          DEPLOYMENT_URL=$(tr -d '[:space:]' < deployment-url.txt)
          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo "::error::vercel deploy succeeded but returned an empty deployment URL."
            exit 1
          fi
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $DEPLOYMENT_URL"

      - name: Alias preview to dev.ds3atucsd.com
        if: github.ref_name == 'dev'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy_preview.outputs.deployment_url }}
        run: |
          set -euo pipefail
          SCOPE=$(node -p "require('./.vercel/project.json').orgId")
          if [[ -z "$SCOPE" || "$SCOPE" == "undefined" || "$SCOPE" == "null" ]]; then
            echo "::error::Could not read Vercel team/org scope from .vercel/project.json"
            exit 1
          fi
          echo "Aliasing $DEPLOYMENT_URL → dev.ds3atucsd.com (scope=$SCOPE)"
          if ! vercel alias set "$DEPLOYMENT_URL" "dev.ds3atucsd.com" --token="$VERCEL_TOKEN" --scope="$SCOPE"; then
            echo "::error::Failed to alias to dev.ds3atucsd.com. Fix domain authorization/ownership in Vercel; do not bypass verification."
            exit 1
          fi

  deploy-production:
    needs: resolve
    if: needs.resolve.outputs.mode == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --token=$VERCEL_TOKEN

      - name: Build (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_GOOGLE_CALENDAR_ID: ${{ secrets.VITE_GOOGLE_CALENDAR_ID }}
          VITE_GOOGLE_CALENDAR_API_KEY: ${{ secrets.VITE_GOOGLE_CALENDAR_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TALENTLENS_V2_API_URL: ${{ secrets.VITE_TALENTLENS_V2_API_URL }}
        run: |
          set -euo pipefail
          export VITE_SUPABASE_URL="${VITE_SUPABASE_URL:-}"
          export VITE_SUPABASE_ANON_KEY="${VITE_SUPABASE_ANON_KEY:-}"
          export VITE_TALENTLENS_V2_API_URL="${VITE_TALENTLENS_V2_API_URL:-}"
          bash scripts/write-vite-env-for-ci.sh
          echo "🏗️ Building for Production"
          vercel build --prod --token="$VERCEL_TOKEN"
          bash scripts/verify-vite-env-in-dist.sh

      - name: Deploy (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "🚀 Production Deploy"
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
