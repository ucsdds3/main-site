name: Supabase migrations

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply pending migrations to the linked Membership project (dumps a backup first)"
        type: boolean
        default: false

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate migrations (ephemeral Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Stub existing public.Members (brownfield)
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create table public."Members" (
            id bigint generated always as identity primary key,
            email text,
            admin_level text,
            deleted boolean default false
          );
          SQL

      - name: Apply checked-in up migrations
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No supabase/migrations/*.sql files"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Smoke-test revert script
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/revert/20260923120000_sprint_task_due_date.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/revert/20260923013000_sprint_hours_and_membership.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/revert/20260923000000_sprint_task_reviews.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/revert/20260907220000_create_sprints.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260907220000_create_sprints.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923000000_sprint_task_reviews.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923013000_sprint_hours_and_membership.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923120000_sprint_task_due_date.sql

  dry_run:
    name: Dry-run against linked project
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if remote secrets are not configured
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Remote dry-run skipped. Add SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: 2.116.0

      - name: Link and dry-run
        if: steps.secrets.outputs.configured == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --dry-run

  apply:
    name: Backup then apply to linked project
    needs: [validate]
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.apply == 'true'
    runs-on: ubuntu-latest
    environment: supabase-prod
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Dump pre-migration backup
        run: |
          mkdir -p backups
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          if [ -n "$SUPABASE_DB_URL" ]; then
            supabase db dump --db-url "$SUPABASE_DB_URL" -f "backups/schema-${stamp}.sql"
            supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f "backups/data-${stamp}.sql"
          else
            supabase link --project-ref "$SUPABASE_PROJECT_ID"
            supabase db dump --linked -f "backups/schema-${stamp}.sql"
            supabase db dump --linked --data-only --use-copy -f "backups/data-${stamp}.sql"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: supabase-pre-migrate-${{ github.sha }}
          path: backups/
          retention-days: 90

      - name: Apply pending migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push
          if [ -n "$SUPABASE_DB_URL" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema';"
          fi
